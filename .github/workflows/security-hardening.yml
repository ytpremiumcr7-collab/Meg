name: Security Hardening

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip check --python .venv/bin/python
      - run: uv export --frozen --extra dev --no-emit-project --format requirements-txt > /tmp/megalodon-audit.txt
      - run: uvx pip-audit --strict --disable-pip --no-deps -r /tmp/megalodon-audit.txt

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --experimental-strip-types --test tests/session-client.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: megalodon
          POSTGRES_PASSWORD: megalodon_ci_password
          POSTGRES_DB: megalodon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U megalodon -d megalodon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://megalodon:megalodon_ci_password@localhost:5432/megalodon
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-secret-that-is-long-enough-and-not-production
      ENVIRONMENT: staging
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: alembic upgrade head
      - run: python -m scripts.verify_migrated_schema
      - run: timeout 120s python -m scripts.smoke_runtime_ci
      - name: Run bounded backend tests and preserve the diagnostic log
        run: |
          set -o pipefail
          timeout --kill-after=30s 5m pytest -vv --maxfail=5 --durations=10 -o faulthandler_timeout=30 2>&1 | tee backend-integration.log
      - name: Preserve runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-${{ github.run_id }}
          path: |
            backend/runtime-smoke-report.json
            backend/runtime-smoke-server.log
            backend/backend-integration.log
          if-no-files-found: ignore
          retention-days: 14

  migration-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: megalodon
          POSTGRES_PASSWORD: megalodon_ci_password
          POSTGRES_DB: migration_history_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U megalodon -d migration_history_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://megalodon:megalodon_ci_password@localhost:5432/migration_history_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-secret-that-is-long-enough-and-not-production
      ENVIRONMENT: staging
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Use PostgreSQL 16 client tools
        run: |
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: timeout 10m python -m scripts.verify_migration_recovery_ci
        env:
          MIGRATION_CI_CONTAINER: ${{ job.services.postgres.id }}
      - name: Preserve migration and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-recovery-${{ github.run_id }}
          path: backend/migration-recovery-report.json
          if-no-files-found: ignore
          retention-days: 14
