- id: LAASSP_50
  articulo: Art. 50 LAASSP
  descripcion: "Las act as de las juntas de aclaraciones, del acto de presentación\
    \ y apertura de proposiciones, y de \nla junta pública en la que se dé a conocer\
    \ el fallo serán firmadas electrónica"
  tipo: plazo
  estado: fallo
  texto_completo: "Artículo 50.  Las act as de las juntas de aclaraciones, del acto\
    \ de presentación y apertura de proposiciones, y de \nla junta pública en la que\
    \ se dé a conocer el fallo serán firmadas electrónicamente por las personas servidoras\
    \ \npúblicas que intervienen en ellas. En el caso de la s actas de las juntas\
    \ de aclaraciones, serán firmadas por los \nlicitantes que hubieran enviado preguntas,\
    \ sin que la falta de firma de alguno de ellos reste validez o efectos a las \n\
    mismas.  \nLas actas a que se refiere "
- id: LAASSP_51
  articulo: Art. 51 LAASSP
  descripcion: "Las dependencias y entidades procederán a declarar desierta una licitación,\
    \ cuando la totalidad de \nlas proposiciones presentadas no reúnan los requisitos\
    \ soli citados o los precio"
  tipo: plazo
  estado: fallo
  texto_completo: "Artículo 51.  Las dependencias y entidades procederán a declarar\
    \ desierta una licitación, cuando la totalidad de \nlas proposiciones presentadas\
    \ no reúnan los requisitos soli citados o los precios de todos los bienes, arrendamientos\
    \ \no servicios ofertados no resulten aceptables.  \nEn los casos en que no existan\
    \ proveedores nacionales, en los lineamientos de contratación específicos a que\
    \ se \nrefiere el último párrafo del artículo 4  de esta Ley, podrá establecerse\
    \ un porcentaje menor al utilizado"
