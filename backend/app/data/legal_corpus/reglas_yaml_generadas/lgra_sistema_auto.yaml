- id: LGRA_108
  articulo: Art. 108 LGRA
  descripcion: "El recurso será resuelto tomando en consideración la investigación\
    \ que conste en el \nExpediente de presunta responsabilidad administrativa y los\
    \ elementos que aporten el Denunciant"
  tipo: regla
  estado: sistema
  texto_completo: "Artículo 108.  El recurso será resuelto tomando en consideración\
    \ la investigación que conste en el \nExpediente de presunta responsabilidad administrativa\
    \ y los elementos que aporten el Denunciante o el \npresunto infractor. Contra\
    \ la resolución que se dicte no procederá recurso alguno ."
- id: LGRA_109
