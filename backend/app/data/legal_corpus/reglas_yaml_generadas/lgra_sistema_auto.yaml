  descripcion: "Son partes en el procedimiento de responsabilidad administrativa:\
    \  \n \nI. La Autoridad investigadora;  \n \nII. El servidor público señalado\
    \ como presunto responsable de la Falta admi"
  tipo: procedimiento
  estado: sistema
  texto_completo: "Artículo 116. Son partes en el procedimiento de responsabilidad\
    \ administrativa:  \n \nI. La Autoridad investigadora;  \n \nII. El servidor público\
