  estado: sistema
  texto_completo: "Artículo 109. El escrito por el cual se interponga el recurso de\
    \ inconformidad deberá contener los \nsiguientes requisitos:  \n \nI. Nombre y\
    \ domicilio del recurrente;  \n \nII. La fecha en que se le notificó la calificación\
