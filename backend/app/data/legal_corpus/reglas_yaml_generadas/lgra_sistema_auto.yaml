  descripcion: "En caso de que con posterioridad a la admisión del informe las autoridades\
    \ \ninvestigadoras adviertan la probable comisión de cualquier otra falta adm\
    \ inistrativa imputable a la mis"
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 114. En caso de que con posterioridad a la admisión del\
    \ informe las autoridades \ninvestigadoras adviertan la probable comisión de cualquier\
    \ otra falta adm inistrativa imputable a la misma \npersona señalada como presunto\
    \ responsable, deberán elaborar un diverso Informe de Presunta \nResponsabilidad\
    \ Administrativa y promover el respectivo procedimiento de responsabilidad administrativa\
    \ \npor separado, sin perjuicio  de que, en el momento procesal oportuno, puedan\
    \ solicitar su acumulación."
