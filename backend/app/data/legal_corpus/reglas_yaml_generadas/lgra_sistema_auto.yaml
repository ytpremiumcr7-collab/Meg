    \ \nIV. Firma autógrafa del recurrente. La omisión de este requisito dará lugar\
    \ a que no se tenga \npor presentado el recurso, por lo qu"
- id: LGRA_110
  articulo: Art. 110 LGRA
  descripcion: "La resolución del recurso consistirá en:  \n \nI. Confirmar la calificación\
    \ o abstención, o  \n \n \n LEY GENERAL DE RESPONSABILIDADES ADMINISTRATIVAS \
    \ \n \nSecretaría de Servicios Parlam"
  tipo: facultad
  estado: sistema
  texto_completo: "Artículo 110. La resolución del recurso consistirá en:  \n \nI.\
    \ Confirmar la calificación o abstención, o  \n \n \n LEY GENERAL DE RESPONSABILIDADES\
