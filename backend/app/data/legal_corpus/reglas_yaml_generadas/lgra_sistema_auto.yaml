  articulo: Art. 118 LGRA
  descripcion: "En lo que no se oponga a lo dispuesto en el procedimiento de responsabilidad\
    \ \nadministrativa, será de aplicación supletoria lo dispuesto en la Ley Federal\
    \ de Procedimiento Contenci"
  tipo: procedimiento
  estado: sistema
  texto_completo: "Artículo 118. En lo que no se oponga a lo dispuesto en el procedimiento\
    \ de responsabilidad \nadministrativa, será de aplicación supletoria lo dispuesto\
    \ en la Ley Federal de Procedimiento Contencioso \nAdministrati vo o las leyes\
