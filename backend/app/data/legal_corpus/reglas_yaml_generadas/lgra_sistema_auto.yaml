  estado: sistema
  texto_completo: "Artículo 115. La autoridad a quien se encomiende la substanciación\
    \ y, en su caso, resolución del \nprocedimiento de responsabilidad administrativa,\
    \ deberá ser distinto de aquél o aqu ellos encargados de \nla investigación. Para\
