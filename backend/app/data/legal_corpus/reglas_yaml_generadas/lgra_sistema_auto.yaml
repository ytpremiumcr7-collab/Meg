    \ \nTÍTULO SEGUNDO  \nDEL PROCEDIMIENTO DE RESPONSABILI"
- id: LGRA_111
  articulo: Art. 111 LGRA
  descripcion: "En los procedimientos de responsabilidad administrativa deberán observarse\
    \ los  \nprincipios de legalidad, presunción de inocencia, imparcialidad, objetividad,\
    \ congruencia, exhausti"
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 111. En los procedimientos de responsabilidad administrativa\
    \ deberán observarse los  \nprincipios de legalidad, presunción de inocencia,\
    \ imparcialidad, objetividad, congruencia, exhaustividad, \nverdad material y\
    \ respeto a los derechos humanos."
- id: LGRA_112
  articulo: Art. 112 LGRA
  descripcion: "El procedimiento de responsabilidad administrativa dará inicio cuando\
    \ las autoridade s \nsubstanciadoras, en el ámbito de su competencia, admitan\
    \ el Informe de Presunta Responsabili"
  tipo: procedimiento
  estado: sistema
  texto_completo: "Artículo 112. El procedimiento de responsabilidad administrativa\
    \ dará inicio cuando las autoridade s \nsubstanciadoras, en el ámbito de su competencia,\
    \ admitan el Informe de Presunta Responsabilidad \nAdministrativa."
- id: LGRA_113
  articulo: Art. 113 LGRA
  descripcion: "La admisión del Informe de Presunta Responsabilidad Administrativa\
    \ interrumpirá los \nplazos de prescripción señalados en el artí culo 74 de esta\
    \ Ley y fijará la materia del procedi"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 113. La admisión del Informe de Presunta Responsabilidad\
    \ Administrativa interrumpirá los \nplazos de prescripción señalados en el artí\
    \ culo 74 de esta Ley y fijará la materia del procedimiento de \nresponsabilidad\
