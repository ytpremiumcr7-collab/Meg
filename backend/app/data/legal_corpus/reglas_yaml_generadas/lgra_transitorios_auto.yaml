  articulo: Art. 154 LGRA
  descripcion: "Los testigos serán interrogado s por separado, debiendo la Autoridad\
    \ resolutora tomar \nlas medidas pertinentes para evitar que entre ellos se comuniquen.\
    \ Los testigos ofrecidos por"
