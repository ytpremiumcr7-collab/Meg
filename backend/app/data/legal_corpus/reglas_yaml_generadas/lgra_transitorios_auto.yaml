  descripcion: "Cuando el testigo desconozca el idioma esp añol, o no lo sepa leer,\
    \ la Autoridad \nresolutora del asunto designará un traductor, debiendo, en estos\
    \ casos, asentar la declaración del"
  tipo: obligacion
  estado: transitorios
