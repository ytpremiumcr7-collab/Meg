    \ vía incidental."
- id: LGRA_161
  articulo: Art. 161 LGRA
  descripcion: "Los documentos privados se presentarán en original, y, cuando formen\
    \ parte de un \nexpediente o legajo, se exhibirán para que se compulse la parte\
    \ que señalen los interesados ."
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 161. Los documentos privados se presentarán en original,\
    \ y, cuando formen parte de un \nexpediente o legajo, se exhibirán para que se\
    \ compulse la parte que señalen los interesados ."
- id: LGRA_162
  articulo: Art. 162 LGRA
  descripcion: "Podrá pedirse el cotejo de firmas, letras o huellas digitales, siempre\
    \ que se niegue o se \nponga en duda la autenticidad de un documento público o\
    \ privado. La persona que solicite "
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 162. Podrá pedirse el cotejo de firmas, letras o huellas\
    \ digitales, siempre que se niegue o se \nponga en duda la autenticidad de un\
    \ documento público o privado. La persona que solicite el cotejo \nseñalará el\
    \ documento o documentos indubitados par a hacer el cotejo, o bien, pedirá a la\
    \ Autoridad \nresolutora que cite al autor de la firma, letras o huella digital,\
    \ para que en su presencia estampe aquellas \nnecesarias para el cotejo."
- id: LGRA_163
  articulo: Art. 163 LGRA
  descripcion: "Se considerarán indubitables para el cotejo:  \n \nI. Los doc umentos\
    \ que las partes reconozcan como tales, de común acuerdo;  \n \nII. Los documentos\
    \ privados cuya letra o firma haya "
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 163. Se considerarán indubitables para el cotejo:  \n\
    \ \nI. Los doc umentos que las partes reconozcan como tales, de común acuerdo;\
    \  \n \nII. Los documentos privados cuya letra o firma haya sido reconocida ante\
    \ la Autoridad \nresolutora del asunto, por aquél a quien se atribuya la dudosa;\
    \  \n \nIII. Los documentos cuya letra, firma o huella digital haya sido declarada\
    \ en la vía judicial \ncomo propia de aquél a quien se atribuya la dudosa, salvo\
    \ que dicha declaración se haya \nhecho en rebeldía, "
- id: LGRA_164
  articulo: Art. 164 LGRA
  descripcion: "La Autoridad substanciadora o resolutora podrá solicitar la colaboración\
    \ del ministerio \npúblico federal o de las entidades federativas, para determinar\
    \ la autenticidad de cualquie"
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 164. La Autoridad substanciadora o resolutora podrá solicitar\
    \ la colaboración del ministerio \npúblico federal o de las entidades federativas,\
    \ para determinar la autenticidad de cualquier documento \nque sea cuestionado\
    \ por las partes."
- id: LGRA_165
  articulo: Art. 165 LGRA
  descripcion: "Se reconoce como prueba la información generada o comunicada que conste\
    \ en \nmedios electrónicos, ópticos o en c ualquier otra tecnología.  \n \nPara\
    \ valorar la fuerza probatoria de l"
  tipo: procedimiento
  estado: transitorios
  texto_completo: "Artículo 165. Se reconoce como prueba la información generada o\
    \ comunicada que conste en \nmedios electrónicos, ópticos o en c ualquier otra\
    \ tecnología.  \n \nPara valorar la fuerza probatoria de la información a que\
    \ se refiere el párrafo anterior, se estimará \nprimordialmente la fiabilidad\
    \ del método en que haya sido generada, comunicada, recibida o archivada y, \n\
    en su caso, si es posi ble atribuir a las personas obligadas el contenido de la\
    \ información relativa y ser \naccesible para su ulterior c"
- id: LGRA_166
  articulo: Art. 166 LGRA
  descripcion: "Las partes podrán objetar el alcance y valor probatorio de los documentos\
    \ aportados \ncomo prueba en el procedimiento de responsabilidad administrativa\
    \ en la vía incidental prevista"
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 166. Las partes podrán objetar el alcance y valor probatorio\
    \ de los documentos aportados \ncomo prueba en el procedimiento de responsabilidad\
    \ administrativa en la vía incidental prevista en esta \nLey."
- id: LGRA_167
  articulo: Art. 167 LGRA
  descripcion: "La prueba pericial tendrá lugar cuando para determinar la verdad de\
    \ los hechos sea \nnecesario contar con los conocimientos especiales de una ciencia,\
    \ arte, técnica, oficio, industr"
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 167. La prueba pericial tendrá lugar cuando para determinar\
    \ la verdad de los hechos sea \nnecesario contar con los conocimientos especiales\
    \ de una ciencia, arte, técnica, oficio, industria o \nprofesión."
- id: LGRA_168
  articulo: Art. 168 LGRA
  descripcion: "Quienes sean propuestos como perito s deberán tener título en la ciencia,\
    \ arte, técnica, \noficio, industria o profesión a que pertenezca la cuestión\
    \ sobre la que han de rendir pare"
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 168. Quienes sean propuestos como perito s deberán tener\
    \ título en la ciencia, arte, técnica, \noficio, industria o profesión a que pertenezca\
    \ la cuestión sobre la que han de rendir parecer, siempre que \nla ley exija dicho\
    \ título para su ejercicio. En caso contrario, podrán ser autorizados por la au\
    \ toridad \nresolutora para actuar como peritos, quienes a su juicio cuenten con\
    \ los conocimientos y la experiencia \npara emitir un dictamen sobre la cuestión."
- id: LGRA_169
  articulo: Art. 169 LGRA
  descripcion: "Las partes ofrecerán sus peritos indicando expresamente la ciencia,\
    \ arte, técnica, ofi cio, \nindustria o profesión sobre la que deberá practicarse\
    \ la prueba, así como los puntos y "
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 169. Las partes ofrecerán sus peritos indicando expresamente\
    \ la ciencia, arte, técnica, ofi cio, \nindustria o profesión sobre la que deberá\
    \ practicarse la prueba, así como los puntos y las cuestiones \nsobre las que\
    \ versará la prueba."
- id: LGRA_170
  articulo: Art. 170 LGRA
  descripcion: "En el acuerdo en que se resuelva la admisión de la prueba, se requerirá\
    \ al oferente para \nque presente  a su perito el día y hora que se señale por\
    \ la Autoridad resolutora del asun"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 170. En el acuerdo en que se resuelva la admisión de la\
    \ prueba, se requerirá al oferente para \nque presente  a su perito el día y hora\
    \ que se señale por la Autoridad resolutora del asunto, a fin de que \nacepte\
    \ y proteste desempeñar su cargo de conformidad con la ley. En caso de no hacerlo,\
    \ se tendrá por \nno ofrecida  la prueba."
- id: LGRA_171
  articulo: Art. 171 LGRA
  descripcion: "Al admitir la prueba p ericial, la Autoridad resolutora del asunto\
    \ dará vista a las demás \npartes por el término de tres días para que propongan\
    \ la ampliación de otros puntos y cue"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 171. Al admitir la prueba p ericial, la Autoridad resolutora\
    \ del asunto dará vista a las demás \npartes por el término de tres días para\
    \ que propongan la ampliación de otros puntos y cuestiones para \nque el perito\
    \ determine."
- id: LGRA_172
  articulo: Art. 172 LGRA
  descripcion: "En caso de que el perito haya aceptado y protes tado su cargo, la\
    \ Autoridad resolutora \ndel asunto fijará prudentemente un plazo para que el\
    \ perito presente el dictamen correspondi"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 172. En caso de que el perito haya aceptado y protes tado\
    \ su cargo, la Autoridad resolutora \ndel asunto fijará prudentemente un plazo\
    \ para que el perito presente el dictamen correspondiente. En \ncaso de no presentarse\
    \ dicho dictamen, la prueba se declarará desierta."
- id: LGRA_173
  articulo: Art. 173 LGRA
  descripcion: "Las demás partes del procedim iento administrativo, podrán a su vez\
    \ designar un perito \npara que se pronuncie sobre los aspectos cuestionados por\
    \ el oferente de la prueba, así como"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 173. Las demás partes del procedim iento administrativo,\
    \ podrán a su vez designar un perito \npara que se pronuncie sobre los aspectos\
    \ cuestionados por el oferente de la prueba, así como por los \nampliados por\
    \ las demás partes, debiéndose proceder en los términos descritos en el artículo\
    \ 169 d e esta \nLey."
- id: LGRA_174
  articulo: Art. 174 LGRA
  descripcion: "Presentados los dictámenes por parte de los peritos, la autoridad\
    \ resolutora convocará \na los mismos a una audiencia donde las partes y la autoridad\
    \ misma, podrán solicitarles las "
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 174. Presentados los dictámenes por parte de los peritos,\
    \ la autoridad resolutora convocará \na los mismos a una audiencia donde las partes\
    \ y la autoridad misma, podrán solicitarles las aclaraciones \ny explicaciones\
    \ que estimen conducent es."
- id: LGRA_175
  articulo: Art. 175 LGRA
  descripcion: Las partes absolverán los costos de los honorarios de los peritos que
    ofrezcan.
