  articulo: Art. 159 LGRA
  descripcion: "Son documentos públicos, todos aquellos que sean expedidos por los\
    \ servidores \npúblicos en el ejercicio de sus funciones. Son documentos privados\
    \ los que no cumplan con la condició"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo  159. Son documentos públicos, todos aquellos que sean\
    \ expedidos por los servidores \npúblicos en el ejercicio de sus funciones. Son\
    \ documentos privados los que no cumplan con la condición \nanterior."
- id: LGRA_160
  articulo: Art. 160 LGRA
  descripcion: "Los documentos que consten en un idioma extr anjero o en cualquier\
    \ lengua o dialecto, \ndeberán ser traducidos en idioma español castellano. Para\
    \ tal efecto, la Autoridad resolutora"
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 160. Los documentos que consten en un idioma extr anjero\
    \ o en cualquier lengua o dialecto, \ndeberán ser traducidos en idioma español\
    \ castellano. Para tal efecto, la Autoridad resolutora del asunto \nsolicitará\
    \ su traducción por medio de un perito designado por ella misma. Las objeciones\
