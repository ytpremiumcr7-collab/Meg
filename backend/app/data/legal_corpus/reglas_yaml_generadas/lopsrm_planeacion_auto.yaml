  texto_completo: "Artículo 23. - En las obras públicas y los servicios relacionados\
    \ con las mismas, cuya ejecución rebase \nun ejercicio presupuestal, las dependencias\
    \ o entidades deberán determinar tanto el presupuesto total, \ncomo el relativo\
    \ a los ejercicios de que se trate;  en la formulación de los presupuestos de\
    \ los ejercicios \nsubsecuentes, además de considerar los costos que, en su momento,\
    \ se encuentren vigentes, se \ndeberán tomar en cuenta las previsiones necesarias\
    \ para los ajustes de costos y convenio"
