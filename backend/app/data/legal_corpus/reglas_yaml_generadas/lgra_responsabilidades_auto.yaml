- id: LGRA_68
  articulo: Art. 68 LGRA
  descripcion: "Incurrirá en tráfico de influencias  para inducir a la autoridad el\
    \ particular que use su \ninfluencia, poder económico o político, real o ficticio,\
    \ sobre cualquier servidor público"
  tipo: regla
  estado: responsabilidades
  texto_completo: "Artículo 68. Incurrirá en tráfico de influencias  para inducir\
    \ a la autoridad el particular que use su \ninfluencia, poder económico o político,\
    \ real o ficticio, sobre cualquier servidor público, con el propósito de \nobtener\
    \ para sí o  para un tercero un beneficio o ventaja, o para causar perjuicio a\
    \ alguna persona o al \nservicio público, con independencia de la aceptación del\
    \ servidor o de los Servidores Públicos o del \nresultado obtenido."
