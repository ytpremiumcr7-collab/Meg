  descripcion: "Corresponde a las Secretarías o a los Órganos  internos de control\
    \ imponer las sanciones \npor Faltas administrativas no graves, y ejecutarlas.\
    \ Los Órganos internos de control podrá"
  tipo: facultad
  estado: responsabilidades
  texto_completo: "Artículo 77. Corresponde a las Secretarías o a los Órganos  internos\
    \ de control imponer las sanciones \npor Faltas administrativas no graves, y ejecutarlas.\
    \ Los Órganos internos de control podrán abstenerse \nde imponer la sanción que\
    \ corresponda siempre que el servidor público:  \n \nI. No haya sido sancionado\
