    \ con motivo de su empleo, cargo o comisión en el servicio público, y \ndirectamen\
    \ te permita que el contratante se beneficie en el mercado o se coloque en situación\
    \ ventajosa \nfrente a sus competidores. En este supuesto también será sancionado\
    \ el ex servidor público"
