    \ el convenio \nrespectivo obligará a las mismas, y su cumplimiento podrá ser\
    \ demandado por la vía judic"
  tipo: plazo
  estado: general
  texto_completo: "Artículo 97.  En el supuesto de que las partes lleguen a un acuerdo\
    \ durante la conciliación, el convenio \nrespectivo obligará a las mismas, y su\
