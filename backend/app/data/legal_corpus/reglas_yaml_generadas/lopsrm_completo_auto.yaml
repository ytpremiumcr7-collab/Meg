- id: LOPSRM_97_Bis
  articulo: Art. 97 Bis LOPSRM
  descripcion: "La Secretaría, en los procedimientos de sanción, inconformidades y\
    \ de conciliación a \nque se refiere esta Ley, podrá hacer uso de los medios de\
    \ apremio que se indican a continu aci"
  tipo: plazo
  estado: general
  texto_completo: "Artículo 97 Bis.  La Secretaría, en los procedimientos de sanción,\
    \ inconformidades y de conciliación a \nque se refiere esta Ley, podrá hacer uso\
    \ de los medios de apremio que se indican a continu ación, para \nhacer cumplir\
    \ sus determinaciones:  \n \nI. Multa de cien a ciento cincuenta veces el valor\
    \ diario de la UMA, la cual podrá duplicarse o \ntriplicarse en cada ocasión,\
    \ hasta alcanzar dos mil veces el valor diario de la UMA, en caso \nde renuencia\
    \ al cum plimiento del mandato respectivo;  \n \nII. "
