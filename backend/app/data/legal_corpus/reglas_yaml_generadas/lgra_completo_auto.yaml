  texto_completo: "Artículo 120. Las autoridades substanciadoras o resolutoras, podrán\
    \ hacer uso de los siguientes \nmedios de apremio para hacer cumplir sus determinaciones:\
    \  \n \nI. Multa de cien a ciento cincuenta veces el valor diario de la Unidad\
    \ de Medida y \nActualización, la cual podrá duplicarse o triplicarse en cada\
    \ ocasión, hasta alcanzar dos mil \n \n LEY GENERAL DE RESPONSABILIDADES ADMINISTRATIVAS\
    \  \n \nSecretaría de Servicios Parlamentarios   \n \n36 de 79 veces el valor\
    \ diario de la Un idad de Medida y Actua"
- id: LGRA_121
  articulo: Art. 121 LGRA
  descripcion: "Las medidas de apremio podrán ser decretadas sin seguir rigurosamente\
    \ el orden en \nque han sido enlistadas en el artículo que antecede, o bien, decretar\
    \ la aplicación de más de una"
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 121. Las medidas de apremio podrán ser decretadas sin\
    \ seguir rigurosamente el orden en \nque han sido enlistadas en el artículo que\
    \ antecede, o bien, decretar la aplicación de más de una de \nellas, para lo cual\
    \ la autoridad deberá ponderar las circunstancias del caso."
- id: LGRA_122
  articulo: Art. 122 LGRA
  descripcion: "En caso de que pese a la aplicación de las medidas de apremio no se\
    \ logre el \ncumplimiento de las determinaciones ordenadas, se dará vista a la\
    \ autoridad penal competente para que "
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 122. En caso de que pese a la aplicación de las medidas\
    \ de apremio no se logre el \ncumplimiento de las determinaciones ordenadas, se\
    \ dará vista a la autoridad penal competente para que \nproceda en los términos\
    \ de la legislación aplicable.  \n \nSección Tercera  \nMedidas cautelares"
- id: LGRA_123
  articulo: Art. 123 LGRA
  descripcion: "Las autoridades investigadoras podrán solicitar a la autoridad substanciadora\
    \ o \nresolutora, que decrete aquellas medidas cautelares que:  \n \nI. Eviten\
    \ el ocult amiento o destrucci"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 123. Las autoridades investigadoras podrán solicitar a\
    \ la autoridad substanciadora o \nresolutora, que decrete aquellas medidas cautelares\
    \ que:  \n \nI. Eviten el ocult amiento o destrucción de pruebas;  \n \nII. Impidan\
    \ la continuación de los efectos perjudiciales de la presunta falta administrativa;\
    \  \n \nIII. Eviten la obstaculización del adecuado desarrollo del procedimiento\
    \ de responsabilidad \nadministrativa;  \n \nIV. Eviten un dañ o irreparable a\
    \ la Hacienda Pública Federal, o de las enti"
- id: LGRA_124
  articulo: Art. 124 LGRA
  descripcion: "Podrán ser decretadas como medidas cautelares las siguientes:  \n\
    \ \nI. Suspensión temporal del servidor público señalado como presuntamente responsable\
    \ del \nempleo, cargo o comisión "
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 124. Podrán ser decretadas como medidas cautelares las\
    \ siguientes:  \n \nI. Suspensión temporal del servidor público señalado como\
    \ presuntamente responsable del \nempleo, cargo o comisión que desempeñe. Dicha\
    \ suspensió n no prejuzgará ni será indicio  \nde la responsabilidad que se le\
    \ impute, lo cual se hará constar en la resolución en la que \nse decrete. Mientras\
    \ dure la suspensión temporal se deberán decretar, al mismo tiempo, \nlas medidas\
    \ necesarias que le garanticen al pr esunto respons"
- id: LGRA_125
  articulo: Art. 125 LGRA
  descripcion: "El otorgamiento de medidas cautelares se tramitará de manera incidental.\
    \ El escrito en \nel que se soliciten se deberá señalar las pruebas cuyo  ocultamiento\
    \ o destrucción se preten"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 125. El otorgamiento de medidas cautelares se tramitará\
    \ de manera incidental. El escrito en \nel que se soliciten se deberá señalar\
    \ las pruebas cuyo  ocultamiento o destrucción se pretende impedir; \nlos efectos\
    \ perjudiciales que produce la presunta falta administrativa; los actos que obstaculizan\
    \ el \nadecuado desarrollo del procedimiento de responsabilidad administrativa;\
    \ o bien, el daño irreparable a la  \nHacienda Pública Federal, o de las entidades\
    \ federativas, municipios, alcaldías, o"
- id: LGRA_126
  articulo: Art. 126 LGRA
  descripcion: "Con el escrito por el que se soliciten las medidas cautelares se dará\
    \ vista a t odos \naquellos que serán directamente afectados con las mismas, para\
    \ que en un término de cinco días"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 126. Con el escrito por el que se soliciten las medidas\
    \ cautelares se dará vista a t odos \naquellos que serán directamente afectados\
    \ con las mismas, para que en un término de cinco días hábiles \nmanifiesten lo\
    \ que a su derecho convenga. Si la autoridad que conozca del incidente lo estima\
    \ necesario, \nen el acuerdo de admisión podrá conceder pr ovisionalmente las\
    \ medidas cautelares solicitadas."
- id: LGRA_127
  articulo: Art. 127 LGRA
  descripcion: "Transcurrido el plazo señalado en el artículo anterior la Autoridad\
    \ resolutora dictará la \nresolución interlocutoria que corresponda dentro de\
    \ los cinco días hábiles siguientes. En"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 127. Transcurrido el plazo señalado en el artículo anterior\
    \ la Autoridad resolutora dictará la \nresolución interlocutoria que corresponda\
    \ dentro de los cinco días hábiles siguientes. En contra de dicha \ndeterminación\
    \ no procederá recurso alguno."
- id: LGRA_128
  articulo: Art. 128 LGRA
  descripcion: "Las medidas cautelares que tengan por objeto impedir daños a la Hacienda\
    \ Pública \nFederal o de las entidades federativas, municipios o alcaldías, o\
    \ bien, al patrimonio de los entes"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 128. Las medidas cautelares que tengan por objeto impedir\
    \ daños a la Hacienda Pública \nFederal o de las entidades federativas, municipios\
    \ o alcaldías, o bien, al patrimonio de los entes públicos \nsólo se suspenderán\
    \ cuando el presunto responsable otorgue garantía suficiente de la reparación\
    \ del \ndaño y los perjuicios ocasionados."
- id: LGRA_129
  articulo: Art. 129 LGRA
  descripcion: "Se podrá solicitar la suspensión de las medidas cautelares en cualquier\
    \ momento del \nprocedimiento, debiéndose  justificar las razones por las que\
    \ se estime innecesario que éstas c"
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 129. Se podrá solicitar la suspensión de las medidas cautelares\
    \ en cualquier momento del \nprocedimiento, debiéndose  justificar las razones\
    \ por las que se estime innecesario que éstas continúen, \npara lo cual se deberá\
    \ seguir el procedimiento incidental descrito en esta sección. Contra la resolución\
    \ \nque niegue la suspensión de las medidas cautelares no procederá recurso alguno.\
    \  \n \nSección Cuarta  \nDe las pruebas"
- id: LGRA_130
  articulo: Art. 130 LGRA
  descripcion: "Para conocer la verdad de los hechos las autoridades resolutoras podrán\
    \ valerse  de \ncualquier persona o documento, ya sea que pertenezca a las partes\
    \ o a terceros, sin más limitac"
  tipo: facultad
  estado: sistema
  texto_completo: "Artículo 130. Para conocer la verdad de los hechos las autoridades\
    \ resolutoras podrán valerse  de \ncualquier persona o documento, ya sea que pertenezca\
    \ a las partes o a terceros, sin más limitación que \nla de que las pr uebas hayan\
    \ sido obtenidas lícitamente, y con pleno respeto a los derechos humanos,  \n\
    solo estará excluida la confesional a cargo de las partes por absolución de posiciones.\
    \  \n \n \n LEY GENERAL DE RESPONSABILIDADES ADMINISTRATIVAS  \n \nSecretaría\
    \ de Servicios Parlamentarios   \n \n38"
- id: LGRA_131
  articulo: Art. 131 LGRA
  descripcion: "Las pruebas serán valoradas atendiendo a las reglas de la lógica,\
    \ la sana crítica  y de la \nexperiencia."
  tipo: regla
  estado: sistema
  texto_completo: "Artículo 131. Las pruebas serán valoradas atendiendo a las reglas\
    \ de la lógica, la sana crítica  y de la \nexperiencia."
- id: LGRA_132
  articulo: Art. 132 LGRA
  descripcion: "Las autoridades resolutoras recibirán por sí mismas las declaraciones\
    \ de testigos y \nperitos, y presidirán todos los actos de prueba bajo su más\
    \ estricta responsabilidad."
  tipo: regla
  estado: sistema
  texto_completo: "Artículo 132. Las autoridades resolutoras recibirán por sí mismas\
    \ las declaraciones de testigos y \nperitos, y presidirán todos los actos de prueba\
    \ bajo su más estricta responsabilidad."
- id: LGRA_133
  articulo: Art. 133 LGRA
  descripcion: "Las documentales emiti das por las autoridades en ejercicio de sus\
    \ funciones tendrán \nvalor probatorio pleno por lo que respecta a su autenticidad\
    \ o a la veracidad de los hechos a "
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 133. Las documentales emiti das por las autoridades en\
    \ ejercicio de sus funciones tendrán \nvalor probatorio pleno por lo que respecta\
    \ a su autenticidad o a la veracidad de los hechos a los que se \nrefieran, salvo\
    \ prueba en contrario."
- id: LGRA_134
  articulo: Art. 134 LGRA
  descripcion: "Las documentales privadas, las testim oniales, las inspecciones y\
    \ las periciales y demás \nmedios de prueba lícitos que se ofrezcan por las partes,\
    \ solo harán prueba plena cuando a "
  tipo: regla
  estado: sistema
  texto_completo: "Artículo 134. Las documentales privadas, las testim oniales, las\
    \ inspecciones y las periciales y demás \nmedios de prueba lícitos que se ofrezcan\
    \ por las partes, solo harán prueba plena cuando a juicio de la \nAutoridad resolutora\
    \ del asunto resulten fiables y coherentes de acuerdo con la verdad conocida y\
    \ el \nrecto raciocinio de la relación que guarden entre sí, de forma tal que\
    \ generen convicción sobre la \nveracidad de los hechos."
- id: LGRA_135
  articulo: Art. 135 LGRA
  descripcion: "Toda persona señalada como responsable de una falta administrativa\
    \ tiene derecho a \nque se presuma su inocencia hasta q ue no se demuestre, más\
    \ allá de toda duda razonable, su \ncul"
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 135. Toda persona señalada como responsable de una falta\
    \ administrativa tiene derecho a \nque se presuma su inocencia hasta q ue no se\
    \ demuestre, más allá de toda duda razonable, su \nculpabilidad. Las autoridades\
    \ investigadoras tendrán la carga de la prueba para demostrar la veracidad \n\
    sobre los hechos que demuestren la existencia de tales faltas, así como la responsabilidad\
    \ de aqu ellos a \nquienes se imputen las mismas. Quienes sean señalados como\
    \ presuntos responsables de una falta \nad"
- id: LGRA_136
  articulo: Art. 136 LGRA
  descripcion: "Las pruebas deberán ofrecerse en los plazos señalados en esta Ley.\
    \ Las que se \nofrezcan fuera de ellos no serán admitidas salvo que se trate de\
    \ pruebas superve nientes, entendiéndo"
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 136. Las pruebas deberán ofrecerse en los plazos señalados\
    \ en esta Ley. Las que se \nofrezcan fuera de ellos no serán admitidas salvo que\
    \ se trate de pruebas superve nientes, entendiéndose \npor tales, aquellas que\
    \ se hayan producido con posterioridad al vencimiento del plazo para ofrecer \n\
    pruebas; o las que se hayan producido antes, siempre que el que las ofrezca manifieste\
    \ bajo protesta de \ndecir verdad que no tuvo la po sibilidad de conocer su existencia."
- id: LGRA_137
  articulo: Art. 137 LGRA
  descripcion: "De toda prueba superveniente se dará vista a las partes por un término\
    \ de tres días \npara que manifiesten lo que a su derecho convenga."
  tipo: plazo
  estado: sistema
  texto_completo: "Artículo 137. De toda prueba superveniente se dará vista a las\
    \ partes por un término de tres días \npara que manifiesten lo que a su derecho\
    \ convenga."
- id: LGRA_138
  articulo: Art. 138 LGRA
  descripcion: "Los hechos notorios no serán objeto de prueba, pudiendo  la autoridad\
    \ que resuelva el \nasunto referirse a ellos aun cuando las partes no los hubieren\
    \ mencionado."
  tipo: regla
  estado: sistema
  texto_completo: "Artículo 138. Los hechos notorios no serán objeto de prueba, pudiendo\
    \  la autoridad que resuelva el \nasunto referirse a ellos aun cuando las partes\
    \ no los hubieren mencionado."
- id: LGRA_139
  articulo: Art. 139 LGRA
  descripcion: "En caso de que cualquiera de las partes hubiere solicitado la expedición\
    \ de un \ndocumento o informe que obre en poder de cualquier person a o Ente público,\
    \ y no se haya expedido si"
  tipo: facultad
  estado: sistema
  texto_completo: "Artículo 139. En caso de que cualquiera de las partes hubiere solicitado\
    \ la expedición de un \ndocumento o informe que obre en poder de cualquier person\
    \ a o Ente público, y no se haya expedido sin \ncausa justificada, la Autoridad\
    \ resolutora del asunto ordenará que se expida la misma, para lo cual podrá \n\
    hacer uso de los medios de apremio previstos en esta Ley."
- id: LGRA_140
  articulo: Art. 140 LGRA
  descripcion: "Cualquier persona, aun cuando no sea parte en el procedimiento, tiene\
    \ la obligación de \nprestar auxilio a las autoridades resolutoras del asunto\
    \ para la averiguación de la verdad, "
  tipo: obligacion
  estado: sistema
  texto_completo: "Artículo 140. Cualquier persona, aun cuando no sea parte en el\
    \ procedimiento, tiene la obligación de \nprestar auxilio a las autoridades resolutoras\
    \ del asunto para la averiguación de la verdad, por lo que \ndeberán exhibir cualquier\
    \ documento o cosa, o rendir su testimonio en el momento en que sea requeri da\
    \ \npara ello. Estarán exentos de tal obligación los ascendientes, descendientes,\
    \ cónyuges y personas que \ntengan la obligación de mantener el secreto profesional,\
    \ en los casos en que se trate d"
- id: LGRA_142
  articulo: Art. 142 LGRA
  descripcion: "Las autoridades resolutoras del asunto podrán ordenar la realización\
    \ de diligencias para \nmejor proveer, sin que por e llo se entienda abierta de\
    \ nuevo la investigación, disponiend"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 142. Las autoridades resolutoras del asunto podrán ordenar\
    \ la realización de diligencias para \nmejor proveer, sin que por e llo se entienda\
    \ abierta de nuevo la investigación, disponiendo la práctica o \nampliación de\
    \ cualquier diligencia probatoria, siempre que resulte pertinente para el conocimiento\
    \ de los \nhechos relacionados con la existencia de la Falta administrativa y\
    \ la res ponsabilidad de quien la hubiera \ncometido. Con las pruebas que se alleguen\
    \ al procedimiento derivadas de di"
- id: LGRA_143
  articulo: Art. 143 LGRA
  descripcion: "Cuando la preparación o desahogo de las pruebas deba tener lugar fuera\
    \ del ámbito \njurisdiccional de la Autoridad resolutora del asunto, podrá solicitar,\
    \ mediante exhort o o carta "
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 143. Cuando la preparación o desahogo de las pruebas deba\
    \ tener lugar fuera del ámbito \njurisdiccional de la Autoridad resolutora del\
    \ asunto, podrá solicitar, mediante exhort o o carta rogatoria, la \ncolaboración\
    \ de las autoridades competentes del lugar. Tratándose de cartas rogatorias se\
    \ estará a lo \ndispuesto en los tratados y convenciones de los que México sea\
    \ parte.  \n \nSección Quinta  \nDe las pruebas en particular"
- id: LGRA_144
  articulo: Art. 144 LGRA
  descripcion: "La prueba testimonial estará a cargo de todo aquél que tenga conocimiento\
    \ de los \nhechos que las partes deban probar, quienes, por ese hecho, se encuentran\
    \ obligados a rendir \ntest"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 144. La prueba testimonial estará a cargo de todo aquél\
    \ que tenga conocimiento de los \nhechos que las partes deban probar, quienes,\
    \ por ese hecho, se encuentran obligados a rendir \ntestimonio."
- id: LGRA_145
  articulo: Art. 145 LGRA
  descripcion: "Las partes podrán ofrecer los testigos que consideren n ecesarios\
    \ para acreditar los \nhechos que deban demostrar. La Autoridad resolutora podrá\
    \ limitar el número de testigos si con"
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 145. Las partes podrán ofrecer los testigos que consideren\
    \ n ecesarios para acreditar los \nhechos que deban demostrar. La Autoridad resolutora\
    \ podrá limitar el número de testigos si considera \nque su testimonio se refiere\
    \ a los mismos hechos, para lo cual, en el acuerdo donde así lo determine, \n\
    deberá motivar dicha res olución."
- id: LGRA_146
  articulo: Art. 146 LGRA
  descripcion: "La presentación de los testigos será responsabilidad de la parte que\
    \ los ofrezca. Solo \nserán citados por la Autoridad resolutora cuando su oferente\
    \ manifieste que está imposibilit"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 146. La presentación de los testigos será responsabilidad\
    \ de la parte que los ofrezca. Solo \nserán citados por la Autoridad resolutora\
    \ cuando su oferente manifieste que está imposibilitado para \nhacer que se presenten,\
    \ en cuyo caso, se dis pondrá la citación del testigo mediante la aplicación de\
    \ los \nmedios de apremio señalados en esta Ley."
- id: LGRA_147
  articulo: Art. 147 LGRA
  descripcion: "Quienes por motivos de edad o salud no pudieran presentarse a rendir\
    \ su testimonio \nante la Autoridad resolutora, se les tomará su testifica ción\
    \ en su domicilio o en el lugar dond"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 147. Quienes por motivos de edad o salud no pudieran presentarse\
    \ a rendir su testimonio \nante la Autoridad resolutora, se les tomará su testifica\
    \ ción en su domicilio o en el lugar donde se \nencuentren, pudiendo asistir las\
    \ partes a dicha diligencia."
- id: LGRA_148
  articulo: Art. 148 LGRA
  descripcion: "Las personas representantes de elección popular, ministras, ministros,\
    \ magistradas, \nmagistrados, juezas y jueces del Poder Judicial de la  Federación,\
    \ magistrados y magistradas de"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 148. Las personas representantes de elección popular,\
    \ ministras, ministros, magistradas, \nmagistrados, juezas y jueces del Poder\
    \ Judicial de la  Federación, magistrados y magistradas del Tribunal \nde Disciplina\
    \ Judicial, las y los miembros del Órgano de Administración Judicial, las personas\
    \ Servidoras \nPúblicas que sean ratificadas o nombradas con la intervención de\
    \ cualquiera de las Cámaras del \nCongreso de la Unión o los congresos locales,\
    \ las Secretarias y los Secretarios de Despacho"
- id: LGRA_149
  articulo: Art. 149 LGRA
  descripcion: "Con excepción de lo dispuesto en el artículo anterior, las preguntas\
    \ que se dirijan a los \ntestigos se formularán verbal y directamente por las\
    \ partes o por quienes se encuentren a"
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 149. Con excepción de lo dispuesto en el artículo anterior,\
    \ las preguntas que se dirijan a los \ntestigos se formularán verbal y directamente\
    \ por las partes o por quienes se encuentren autorizadas  para \nhacerlo.  \n\
    \ \n \n LEY GENERAL DE RESPONSABILIDADES ADMINISTRATIVAS  \n \nSecretaría de Servicios\
    \ Parlamentarios   \n \n40 de 79"
- id: LGRA_150
  articulo: Art. 150 LGRA
  descripcion: "La parte que haya ofrecido la prueba será la primera que interrogará\
    \ al testigo, \nsiguiendo las demás partes en el orden que determine la Autoridad\
    \ resolutora del asunto."
  tipo: regla
  estado: transitorios
  texto_completo: "Artículo 150. La parte que haya ofrecido la prueba será la primera\
    \ que interrogará al testigo, \nsiguiendo las demás partes en el orden que determine\
    \ la Autoridad resolutora del asunto."
- id: LGRA_151
  articulo: Art. 151 LGRA
  descripcion: "La Autoridad resolutora podrá interrogar libreme nte a los testigos,\
    \ con la finalidad de \nesclarecer la verdad de los hechos."
  tipo: facultad
  estado: transitorios
  texto_completo: "Artículo 151. La Autoridad resolutora podrá interrogar libreme\
    \ nte a los testigos, con la finalidad de \nesclarecer la verdad de los hechos."
- id: LGRA_152
  articulo: Art. 152 LGRA
  descripcion: "Las preguntas y repreguntas que se formulen a los testigos, deben\
    \ referirse a la Falta \nadministrativa que se imputa a los presuntos responsables\
    \ y a los hechos que l es consten di"
  tipo: plazo
  estado: transitorios
  texto_completo: "Artículo 152. Las preguntas y repreguntas que se formulen a los\
    \ testigos, deben referirse a la Falta \nadministrativa que se imputa a los presuntos\
    \ responsables y a los hechos que l es consten directamente a \nlos testigos.\
    \ Deberán expresarse en términos claros y no ser insidiosas, ni contener en ellas\
    \ la respuesta. \nAquellas preguntas que no satisfagan estos requisitos serán\
    \ desechadas, aunque se asentarán \ntextualmente en el acta respec tiva."
- id: LGRA_153
  articulo: Art. 153 LGRA
  descripcion: "Antes de rendir su testimonio, a los testigos se les tomará la protesta\
    \ para conducirse \ncon verdad, y serán apercibidos de las penas en que incurren\
    \ aquellos que declaran con fals"
  tipo: obligacion
  estado: transitorios
  texto_completo: "Artículo 153. Antes de rendir su testimonio, a los testigos se\
    \ les tomará la protesta para conducirse \ncon verdad, y serán apercibidos de\
    \ las penas en que incurren aquellos que declaran con falsedad ante \nautoridad\
    \ distinta a la judicial. Se hará cons tar su nombre, domicilio, nacionalidad,\
    \ lugar de residencia, \nocupación y domicilio, si es pariente por consanguinidad\
    \ o afinidad de alguna de las partes, si mantiene \ncon alguna de ellas relaciones\
    \ de amistad o de negocios, o bien, si tiene alguna"
