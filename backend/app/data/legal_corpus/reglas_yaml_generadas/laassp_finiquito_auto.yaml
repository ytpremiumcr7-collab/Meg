- id: LAASSP_70
  articulo: Art. 70 LAASSP
  descripcion: "Las garantías que deban otorgarse conforme a esta Ley se constituirán\
    \ en favor de:  \nI. La Tesorería de la Federación, por actos o contratos que\
    \ se celebren con las dependencias;  "
  tipo: regla
  estado: finiquito
  texto_completo: "Artículo 70.  Las garantías que deban otorgarse conforme a esta\
    \ Ley se constituirán en favor de:  \nI. La Tesorería de la Federación, por actos\
    \ o contratos que se celebren con las dependencias;  \nII. Las entidades, cuando\
    \ los actos o contratos se celebren con ellas, y  \nIII. Las Tesorerías de las\
    \ entidades federativas o de los municipios, en los casos de los contratos \n\
    celebrados al amparo de la fracción V del artículo 1 de esta Ley."
- id: LAASSP_71
  articulo: Art. 71 LAASSP
  descripcion: "Las dependencias y entidades se abstendrán de adjudicar y formalizar\
    \ contrato alguno  en las \nmaterias a que se refiere esta Ley, con las personas\
    \ siguientes:  \nI. Aquellas en que "
  tipo: plazo
  estado: finiquito
  texto_completo: "Artículo 71.  Las dependencias y entidades se abstendrán de adjudicar\
    \ y formalizar contrato alguno  en las \nmaterias a que se refiere esta Ley, con\
    \ las personas siguientes:  \nI. Aquellas en que la persona servidora pública\
    \ que intervenga en cualquier etapa del procedimiento de \ncontratación tenga\
    \ interés personal, familiar o de negocios, incluyendo aquellas  de las que pueda\
    \ \nresultar algún beneficio para él, su cónyuge o sus parientes consanguíneos\
    \ hasta el cuarto grado, \n \n LEY DE ADQUISICIONE"
